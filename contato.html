<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Game - Contato</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Happy Game</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="projeto.html">Projeto</a></li>
            <li><a href="jogos.html">Jogos</a></li>
            <li><a href="contato.html">Contato</a></li>
        </ul>
    </nav>

    <main>

        <section id="formulario-contato">

            <form action="feedback.html" method="get">

                <div>
                    <label for="nome">Nome</label>
                    <input type="text" name="nome" id="nome" placeholder="Digite seu nome" required>
                </div>

                <div>
                    <label for="email">E-mail</label>
                    <input type="email" name="email" id="email" placeholder="Digite seu e-mail" required>
                </div>

                <div>
                    <label for="assunto">Assunto</label>
                    <input type="text" name="assunto" id="assunto" placeholder="Digite o assunto" required>
                </div>

                <div>
                    <label for="mensagem">Mensagem</label>
                    <textarea name="mensagem" id="mensagem" placeholder="Digite sua mensagem" required></textarea>
                </div>

                <button type="submit">Enviar</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Happy Game</p>
    </footer>

</body>
</html>
